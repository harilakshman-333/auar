version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: ./server/Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ./server/.env
    restart: always

  frontend:
    build:
      context: .
      dockerfile: ./client/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: always
