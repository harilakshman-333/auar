version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: ./server/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    restart: always

  frontend:
    build:
      context: .
      dockerfile: ./client/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: always
